<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مجموعة العناية الوطنية | متجر المستلزمات الطبية</title>
    <meta
      name="description"
      content="منصة التجارة الإلكترونية الطبية لمجموعة العناية الوطنية — مستلزمات وأجهزة طبية موثوقة بتسعير الباقات المتعدد."
    />
    <meta property="og:title" content="مجموعة العناية الوطنية | متجر المستلزمات الطبية" />
    <meta
      property="og:description"
      content="منصة التجارة الإلكترونية الطبية لمجموعة العناية الوطنية — مستلزمات وأجهزة طبية موثوقة بتسعير الباقات المتعدد."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('ncg-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var storedLang = localStorage.getItem('ncg-lang');
          var lang = storedLang === 'en' ? 'en' : 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F7F8] text-[#25343A] dark:bg-[#0B1518] dark:text-[#ECF3F4] antialiased selection:bg-[#267C78]/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
